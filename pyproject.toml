[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shogi-yearbook-analysis"
version = "0.1.0"
description = "Reproducible text analysis of Shogi Yearbook interviews"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
nlp = ["sudachipy==0.6.10", "sudachidict_core==20260428"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
